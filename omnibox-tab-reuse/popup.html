<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>已有标签定位</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img id="app-icon" src="icons/icon-48.png" width="40" height="40" alt="">
      <div><h1>已有标签定位</h1><p>让同一个网址，回到已有标签</p></div>
    </header>
    <main>
      <section class="control">
        <div><h2>自动定位</h2><p id="status" role="status" aria-live="polite">正在读取状态…</p></div>
        <button id="toggle" class="switch" type="button" role="switch"
          aria-label="自动定位已有标签" aria-checked="false" disabled><span></span></button>
      </section>
      <p class="hint">地址栏输入的网址始终放行。其他导航遇到相同网址时，切换并刷新已有标签。</p>
      <section class="recent" aria-label="最近一次定位">
        <h2>最近一次定位 <span id="recent-time"></span></h2>
        <p id="recent-message">本次浏览器会话暂无定位记录。</p>
      </section>
      <p id="error" role="alert" hidden></p>
    </main>
    <footer><span class="dot" id="status-dot"></span><span id="footer-status">加载中</span><span class="version">v1.2.0</span></footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
